<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | Siinaaf School Hub</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:#0f172a;
}


/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    height:68px;

    padding:0 5%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(255,255,255,.95);

    backdrop-filter:blur(15px);

    border-bottom:
    1px solid #e2e8f0;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;

    text-decoration:none;

    color:#0f172a;
}

.logo{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    color:white;

    font-weight:900;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );
}

.brand h2{
    font-size:15px;
}

.brand small{
    display:block;

    color:#64748b;

    font-size:9px;

    margin-top:3px;
}

.back{
    text-decoration:none;

    color:#2563eb;

    font-size:11px;

    font-weight:bold;
}


/* =========================
   HERO
========================= */

.hero{
    padding:65px 5% 45px;

    text-align:center;

    background:
    radial-gradient(
        circle at 20% 20%,
        rgba(37,99,235,.12),
        transparent 30%
    ),
    radial-gradient(
        circle at 80% 80%,
        rgba(124,58,237,.12),
        transparent 30%
    );
}

.hero h1{
    font-size:
    clamp(34px,7vw,55px);

    margin-bottom:10px;
}

.hero h1 span{
    color:#2563eb;
}

.hero p{
    color:#64748b;

    font-size:12px;
}


/* =========================
   CONTAINER
========================= */

.container{
    max-width:1100px;

    margin:auto;

    padding:30px 5% 70px;
}


/* =========================
   SEARCH
========================= */

.searchBox{
    margin-bottom:25px;
}

.searchBox input{
    width:100%;

    height:48px;

    padding:0 15px;

    border:
    1px solid #e2e8f0;

    border-radius:12px;

    outline:none;

    background:white;

    font-size:11px;
}

.searchBox input:focus{
    border-color:#2563eb;
}


/* =========================
   GALLERY
========================= */

.gallery{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:16px;

}

.card{

    position:relative;

    overflow:hidden;

    min-height:250px;

    border-radius:18px;

    background:#0f172a;

    cursor:pointer;

    box-shadow:
    0 8px 25px rgba(15,23,42,.08);

}

.card img{

    width:100%;
    height:100%;

    min-height:250px;

    display:block;

    object-fit:cover;

    transition:
    transform .4s ease;

}

.card:hover img{

    transform:scale(1.07);

}

.overlay{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:25px 17px 17px;

    color:white;

    background:
    linear-gradient(
        transparent,
        rgba(0,0,0,.85)
    );

}

.overlay h3{

    font-size:13px;

    margin-bottom:5px;

}

.overlay p{

    color:#cbd5e1;

    font-size:9px;

    line-height:1.5;

}


/* =========================
   EMPTY
========================= */

.empty{

    display:none;

    padding:60px 20px;

    text-align:center;

    background:white;

    border:
    1px solid #e2e8f0;

    border-radius:18px;

}

.empty h3{

    margin-bottom:8px;

}

.empty p{

    color:#64748b;

    font-size:10px;

}


/* =========================
   LIGHTBOX
========================= */

.lightbox{

    position:fixed;

    inset:0;

    z-index:5000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
    rgba(2,6,23,.92);

}

.lightbox.show{

    display:flex;

}

.lightbox img{

    max-width:95vw;

    max-height:85vh;

    object-fit:contain;

    border-radius:10px;

    box-shadow:
    0 20px 80px rgba(0,0,0,.5);

}

.close{

    position:absolute;

    top:20px;
    right:25px;

    width:42px;
    height:42px;

    border:0;

    border-radius:50%;

    background:white;

    color:#0f172a;

    font-size:20px;

    cursor:pointer;

}

.lightCaption{

    position:absolute;

    bottom:25px;

    left:20px;
    right:20px;

    text-align:center;

    color:white;

    font-size:11px;

}


/* =========================
   FOOTER
========================= */

footer{

    padding:30px;

    text-align:center;

    background:#020617;

    color:#64748b;

    font-size:9px;

}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

    .gallery{

        grid-template-columns:
        repeat(2,1fr);

    }

}

@media(max-width:500px){

    .gallery{

        grid-template-columns:1fr;

    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

    <a
        href="index.html"
        class="brand"
    >

        <div class="logo">
            S³
        </div>

        <div>

            <h2>
                Siinaaf School Hub
            </h2>

            <small>
                Educational Gallery
            </small>

        </div>

    </a>


    <a
        href="index.html"
        class="back"
    >
        ← Home
    </a>

</header>


<!-- HERO -->

<section class="hero">

    <h1>
        School <span>Gallery</span>
    </h1>

    <p>
        Explore educational images and school resources.
    </p>

</section>


<!-- CONTENT -->

<main class="container">


    <div class="searchBox">

        <input
            type="search"
            id="search"
            placeholder="🔎 Search gallery..."
            oninput="renderGallery()"
        >

    </div>


    <div
        id="gallery"
        class="gallery"
    ></div>


    <div
        id="empty"
        class="empty"
    >

        <h3>
            No Images Found
        </h3>

        <p>
            Developer has not added any gallery images yet.
        </p>

    </div>


</main>


<!-- LIGHTBOX -->

<div
    id="lightbox"
    class="lightbox"
    onclick="closeLightbox(event)"
>

    <button
        class="close"
        onclick="closeLightbox()"
    >
        ×
    </button>


    <img
        id="lightboxImage"
        src=""
        alt="Gallery Preview"
    >


    <div
        id="lightCaption"
        class="lightCaption"
    ></div>

</div>


<footer>

    © 2026 Siinaaf School Hub • AS MODEL

</footer>


<script>


/* =========================================
   GET IMAGES
========================================= */

function getImages(){

    try{

        return JSON.parse(

            localStorage.getItem(
                "siinaafImages"
            )

        ) || [];

    }catch(error){

        return [];

    }

}


/* =========================================
   RENDER GALLERY
========================================= */

function renderGallery(){

    const gallery =
        document.getElementById(
            "gallery"
        );

    const empty =
        document.getElementById(
            "empty"
        );


    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    gallery.innerHTML = "";


    const images =
        getImages();


    const filtered =
        images.filter(
            image => {

                const text = (

                    image.title +
                    " " +
                    image.description

                ).toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    if(
        filtered.length === 0
    ){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(
        (image,index) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "card";


            card.innerHTML = `

                <img
                    src="${escapeAttribute(
                        image.url
                    )}"
                    alt="${escapeAttribute(
                        image.title
                    )}"
                    loading="lazy"
                    onerror="this.parentElement.style.display='none'"
                >

                <div class="overlay">

                    <h3>
                        ${escapeHTML(
                            image.title
                        )}
                    </h3>

                    <p>
                        ${escapeHTML(
                            image.description || ""
                        )}
                    </p>

                </div>

            `;


            card.onclick =
                function(){

                    openLightbox(
                        image.url,
                        image.title,
                        image.description
                    );

                };


            gallery.appendChild(
                card
            );

        }
    );

}


/* =========================================
   LIGHTBOX
========================================= */

function openLightbox(
    url,
    title,
    description
){

    const lightbox =
        document.getElementById(
            "lightbox"
        );

    const image =
        document.getElementById(
            "lightboxImage"
        );

    const caption =
        document.getElementById(
            "lightCaption"
        );


    image.src = url;


    caption.textContent =
        title +
        (
            description
            ? " — " + description
            : ""
        );


    lightbox.classList.add(
        "show"
    );

}


/* =========================================
   CLOSE LIGHTBOX
========================================= */

function closeLightbox(event){

    if(
        event &&
        event.target &&
        event.target.id ===
        "lightboxImage"
    ){

        return;

    }


    document
    .getElementById(
        "lightbox"
    )
    .classList.remove(
        "show"
    );

}


/* ESC KEY */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closeLightbox();

        }

    }
);


/* =========================================
   HTML SAFETY
========================================= */

function escapeHTML(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeAttribute(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        );

}


/* =========================================
   INITIAL LOAD
========================================= */

renderGallery();

</script>


</body>
</html>
