<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Questions | Siinaaf School Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:#0f172a;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    height:68px;
    padding:0 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #e2e8f0;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:#0f172a;
}

.logo{
    width:40px;
    height:40px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:900;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.brand h2{
    font-size:15px;
}

.brand small{
    display:block;
    color:#64748b;
    font-size:9px;
    margin-top:3px;
}

.back{
    text-decoration:none;
    color:#2563eb;
    font-size:11px;
    font-weight:bold;
}

.hero{
    padding:60px 5% 40px;
    text-align:center;
    background:
    radial-gradient(circle at 20% 20%,rgba(37,99,235,.12),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(124,58,237,.12),transparent 30%);
}

.hero h1{
    font-size:clamp(32px,6vw,52px);
    margin-bottom:12px;
}

.hero h1 span{
    color:#2563eb;
}

.hero p{
    color:#64748b;
    font-size:12px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:30px 5% 70px;
}

.toolbar{
    display:grid;
    grid-template-columns:1fr 200px;
    gap:10px;
    margin-bottom:25px;
}

input,
select{
    height:45px;
    border:1px solid #e2e8f0;
    border-radius:10px;
    background:white;
    padding:0 13px;
    outline:none;
    font-size:11px;
}

input:focus,
select:focus{
    border-color:#2563eb;
}

.question{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:18px;
    padding:22px;
    margin-bottom:15px;
    box-shadow:0 8px 25px rgba(15,23,42,.04);
}

.questionTop{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.number{
    color:#2563eb;
    font-size:11px;
    font-weight:bold;
}

.subject{
    padding:5px 9px;
    border-radius:20px;
    background:#eff6ff;
    color:#2563eb;
    font-size:9px;
    font-weight:bold;
}

.questionText{
    font-size:14px;
    line-height:1.7;
    font-weight:bold;
    margin-bottom:17px;
}

.options{
    display:grid;
    gap:9px;
}

.option{
    width:100%;
    text-align:left;
    padding:12px;
    border:1px solid #e2e8f0;
    border-radius:10px;
    background:#f8fafc;
    cursor:pointer;
    font-size:11px;
    transition:.2s;
}

.option:hover{
    border-color:#2563eb;
    background:#eff6ff;
}

.option.correct{
    border-color:#16a34a;
    background:#dcfce7;
    color:#166534;
}

.option.wrong{
    border-color:#dc2626;
    background:#fee2e2;
    color:#991b1b;
}

.solution{
    display:none;
    margin-top:15px;
    padding:14px;
    border-radius:11px;
    background:#f1f5f9;
    color:#475569;
    font-size:10px;
    line-height:1.7;
}

.solution.show{
    display:block;
}

.result{
    display:none;
    margin-bottom:20px;
    padding:18px;
    border-radius:15px;
    background:#0f172a;
    color:white;
    text-align:center;
}

.result.show{
    display:block;
}

.result strong{
    display:block;
    font-size:25px;
    margin-bottom:5px;
}

.empty{
    display:none;
    padding:50px 20px;
    text-align:center;
    background:white;
    border-radius:18px;
    border:1px solid #e2e8f0;
}

.empty h3{
    margin-bottom:8px;
}

.empty p{
    color:#64748b;
    font-size:11px;
}

footer{
    padding:30px;
    text-align:center;
    background:#020617;
    color:#64748b;
    font-size:9px;
}

@media(max-width:650px){
    .toolbar{
        grid-template-columns:1fr;
    }

    .question{
        padding:17px;
    }

    .questionText{
        font-size:12px;
    }
}
</style>
</head>

<body>

<header>

    <a href="index.html" class="brand">

        <div class="logo">
            S³
        </div>

        <div>
            <h2>Siinaaf School Hub</h2>
            <small>Questions Center</small>
        </div>

    </a>

    <a href="index.html" class="back">
        ← Home
    </a>

</header>


<section class="hero">

    <h1>
        Practice <span>Questions</span>
    </h1>

    <p>
        Test your knowledge and prepare for your examination.
    </p>

</section>


<main class="container">

    <div class="result" id="result">

        <strong id="score">
            0 / 0
        </strong>

        <span id="scoreText">
            Complete the questions to see your result.
        </span>

    </div>


    <div class="toolbar">

        <input
            type="search"
            id="search"
            placeholder="🔎 Search questions..."
            oninput="renderQuestions()"
        >

        <select
            id="subjectFilter"
            onchange="renderQuestions()"
        >

            <option value="all">
                All Subjects
            </option>

            <option value="Biology">
                Biology
            </option>

            <option value="Chemistry">
                Chemistry
            </option>

            <option value="Physics">
                Physics
            </option>

            <option value="Mathematics">
                Mathematics
            </option>

            <option value="English">
                English
            </option>

        </select>

    </div>


    <div id="questionList"></div>


    <div class="empty" id="empty">

        <h3>
            No Questions Found
        </h3>

        <p>
            Try another search or subject.
        </p>

    </div>

</main>


<footer>

    © 2026 Siinaaf School Hub • AS MODEL

</footer>


<script>

/* =========================================
   STUDENT ACCESS GUARD
========================================= */

const loggedIn =
    sessionStorage.getItem(
        "siinaafStudentLoggedIn"
    ) === "true";


if(!loggedIn){

    alert(
        "Student Login is required to access Questions."
    );

    window.location.href =
        "index.html";

}


/* =========================================
   DEFAULT QUESTIONS
========================================= */

const defaultQuestions = [

{
    subject:"Biology",

    question:
    "Which organelle is primarily responsible for ATP production in eukaryotic cells?",

    options:[
        "Ribosome",
        "Mitochondrion",
        "Golgi apparatus",
        "Lysosome"
    ],

    answer:1,

    solution:
    "Mitochondria are the major sites of aerobic cellular respiration and ATP production."
},

{
    subject:"Chemistry",

    question:
    "What is the molar mass of H₂O?",

    options:[
        "16 g/mol",
        "17 g/mol",
        "18 g/mol",
        "20 g/mol"
    ],

    answer:2,

    solution:
    "H₂O = (2 × 1) + 16 = 18 g/mol."
},

{
    subject:"Physics",

    question:
    "A body moving with constant velocity has what acceleration?",

    options:[
        "Zero",
        "Constant positive acceleration",
        "Constant negative acceleration",
        "Increasing acceleration"
    ],

    answer:0,

    solution:
    "Acceleration is the rate of change of velocity. If velocity remains constant, acceleration is zero."
},

{
    subject:"Mathematics",

    question:
    "If f(x) = 2x + 3, what is f(4)?",

    options:[
        "7",
        "8",
        "11",
        "12"
    ],

    answer:2,

    solution:
    "f(4) = 2(4) + 3 = 11."
},

{
    subject:"English",

    question:
    "Choose the word closest in meaning to 'rapid'.",

    options:[
        "Slow",
        "Quick",
        "Weak",
        "Late"
    ],

    answer:1,

    solution:
    "'Rapid' means fast or quick."
}

];


/* =========================================
   LOAD DEVELOPER QUESTIONS
========================================= */

function getQuestions(){

    const stored =
        localStorage.getItem(
            "siinaafQuestions"
        );

    if(!stored){

        localStorage.setItem(
            "siinaafQuestions",
            JSON.stringify(defaultQuestions)
        );

        return defaultQuestions;
    }

    try{

        return JSON.parse(stored);

    }catch(error){

        return defaultQuestions;

    }

}


let questions = getQuestions();

let score = 0;

let answered = 0;


/* =========================================
   RENDER
========================================= */

function renderQuestions(){

    const list =
        document.getElementById(
            "questionList"
        );

    const empty =
        document.getElementById(
            "empty"
        );

    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();

    const subject =
        document.getElementById(
            "subjectFilter"
        )
        .value;


    list.innerHTML = "";


    const filtered =
        questions.filter(
            q => {

                const matchesSearch =
                    q.question
                    .toLowerCase()
                    .includes(search);

                const matchesSubject =
                    subject === "all" ||
                    q.subject === subject;

                return (
                    matchesSearch &&
                    matchesSubject
                );

            }
        );


    if(filtered.length === 0){

        empty.style.display = "block";

        return;

    }

    empty.style.display = "none";


    filtered.forEach(
        (q,index) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "question";


            let optionsHTML = "";


            q.options.forEach(
                (option,i) => {

                    optionsHTML += `

                    <button
                        class="option"
                        onclick="checkAnswer(
                            ${i},
                            ${q.answer},
                            this,
                            ${index}
                        )"
                    >
                        ${String.fromCharCode(65+i)}.
                        ${escapeHTML(option)}
                    </button>

                    `;

                }
            );


            card.innerHTML = `

                <div class="questionTop">

                    <span class="number">
                        QUESTION ${index+1}
                    </span>

                    <span class="subject">
                        ${escapeHTML(q.subject)}
                    </span>

                </div>

                <div class="questionText">
                    ${escapeHTML(q.question)}
                </div>

                <div class="options">
                    ${optionsHTML}
                </div>

                <div
                    class="solution"
                    id="solution-${index}"
                >
                    <strong>
                        Solution:
                    </strong>
                    <br>
                    ${escapeHTML(q.solution || "No solution added yet.")}
                </div>

            `;


            list.appendChild(card);

        }
    );

}


/* =========================================
   CHECK ANSWER
========================================= */

function checkAnswer(
    selected,
    correct,
    button,
    questionIndex
){

    const parent =
        button.parentElement;

    const buttons =
        parent.querySelectorAll(
            ".option"
        );


    buttons.forEach(
        b => {

            b.disabled = true;

        }
    );


    if(selected === correct){

        button.classList.add(
            "correct"
        );

        score++;

    }else{

        button.classList.add(
            "wrong"
        );

        buttons[correct]
        .classList.add(
            "correct"
        );

    }


    answered++;


    const solution =
        document.getElementById(
            "solution-" + questionIndex
        );

    solution.classList.add(
        "show"
    );


    updateResult();

}


/* =========================================
   RESULT
========================================= */

function updateResult(){

    const result =
        document.getElementById(
            "result"
        );

    const scoreElement =
        document.getElementById(
            "score"
        );

    const scoreText =
        document.getElementById(
            "scoreText"
        );


    result.classList.add("show");


    scoreElement.textContent =
        score +
        " / " +
        answered;


    if(answered === 0){

        scoreText.textContent =
            "Start answering the questions.";

    }

    else if(score / answered >= .8){

        scoreText.textContent =
            "Excellent performance! 🔥";

    }

    else if(score / answered >= .5){

        scoreText.textContent =
            "Good work. Keep practicing. 💪";

    }

    else{

        scoreText.textContent =
            "Keep studying and try again. 📚";

    }

}


/* =========================================
   HTML SAFETY
========================================= */

function escapeHTML(value){

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


/* =========================================
   INITIAL LOAD
========================================= */

renderQuestions();

</script>

</body>
</html>
