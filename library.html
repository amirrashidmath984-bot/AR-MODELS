<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Library | Siinaaf School Hub</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:#0f172a;
}

header{
    position:sticky;
    top:0;
    z-index:1000;

    height:68px;
    padding:0 5%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(255,255,255,.95);
    backdrop-filter:blur(15px);

    border-bottom:1px solid #e2e8f0;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;

    text-decoration:none;
    color:#0f172a;
}

.logo{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    color:white;
    font-weight:900;

    background:linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );
}

.brand h2{
    font-size:15px;
}

.brand small{
    display:block;
    margin-top:3px;
    color:#64748b;
    font-size:9px;
}

.back{
    text-decoration:none;
    color:#2563eb;
    font-size:11px;
    font-weight:bold;
}


/* HERO */

.hero{
    padding:60px 5% 45px;
    text-align:center;

    background:
    radial-gradient(
        circle at 20% 20%,
        rgba(37,99,235,.12),
        transparent 30%
    ),
    radial-gradient(
        circle at 80% 80%,
        rgba(124,58,237,.12),
        transparent 30%
    );
}

.hero h1{
    font-size:clamp(34px,7vw,55px);
    margin-bottom:10px;
}

.hero h1 span{
    color:#2563eb;
}

.hero p{
    color:#64748b;
    font-size:12px;
}


/* CONTAINER */

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 5% 70px;
}


/* FILTER */

.toolbar{
    display:grid;
    grid-template-columns:1fr 190px;
    gap:10px;
    margin-bottom:25px;
}

input,
select{
    height:45px;

    border:1px solid #e2e8f0;
    border-radius:11px;

    padding:0 13px;

    outline:none;
    background:white;

    font-size:11px;
}

input:focus,
select:focus{
    border-color:#2563eb;
}


/* LIBRARY */

.library{
    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:16px;
}

.resource{
    background:white;

    border:1px solid #e2e8f0;

    border-radius:18px;

    padding:20px;

    box-shadow:
    0 8px 25px rgba(15,23,42,.04);

    transition:.2s;
}

.resource:hover{
    transform:translateY(-3px);

    box-shadow:
    0 15px 35px rgba(15,23,42,.08);
}

.resourceIcon{
    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:15px;

    border-radius:13px;

    background:#eff6ff;

    font-size:22px;
}

.resourceMeta{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:10px;
}

.subject{
    padding:5px 8px;

    border-radius:20px;

    background:#eff6ff;
    color:#2563eb;

    font-size:8px;
    font-weight:bold;
}

.type{
    color:#64748b;
    font-size:8px;
    font-weight:bold;
}

.resource h2{
    font-size:14px;
    margin-bottom:8px;
}

.resource p{
    color:#64748b;
    font-size:10px;
    line-height:1.6;

    min-height:48px;

    margin-bottom:15px;
}

.openBtn{
    display:inline-block;

    padding:10px 13px;

    border-radius:9px;

    background:#0f172a;
    color:white;

    text-decoration:none;

    font-size:9px;
    font-weight:bold;
}


/* EMPTY */

.empty{
    display:none;

    padding:60px 20px;

    text-align:center;

    background:white;

    border:1px solid #e2e8f0;

    border-radius:18px;
}

.empty h3{
    margin-bottom:8px;
}

.empty p{
    color:#64748b;
    font-size:10px;
}


/* FOOTER */

footer{
    padding:30px;

    text-align:center;

    background:#020617;
    color:#64748b;

    font-size:9px;
}


@media(max-width:850px){

    .library{
        grid-template-columns:
        repeat(2,1fr);
    }

}

@media(max-width:600px){

    .toolbar{
        grid-template-columns:1fr;
    }

    .library{
        grid-template-columns:1fr;
    }

}

</style>
</head>


<body>


<header>

    <a
        href="index.html"
        class="brand"
    >

        <div class="logo">
            S³
        </div>

        <div>

            <h2>
                Siinaaf School Hub
            </h2>

            <small>
                Digital Library
            </small>

        </div>

    </a>


    <a
        href="index.html"
        class="back"
    >
        ← Home
    </a>

</header>


<section class="hero">

    <h1>
        Digital <span>Library</span>
    </h1>

    <p>
        Books, PDFs and educational resources in one place.
    </p>

</section>


<main class="container">


    <div class="toolbar">

        <input
            type="search"
            id="search"
            placeholder="🔎 Search books and resources..."
            oninput="renderLibrary()"
        >


        <select
            id="subject"
            onchange="renderLibrary()"
        >

            <option value="all">
                All Subjects
            </option>

            <option value="Biology">
                Biology
            </option>

            <option value="Chemistry">
                Chemistry
            </option>

            <option value="Physics">
                Physics
            </option>

            <option value="Mathematics">
                Mathematics
            </option>

            <option value="English">
                English
            </option>

        </select>

    </div>


    <div
        id="library"
        class="library"
    ></div>


    <div
        id="empty"
        class="empty"
    >

        <h3>
            No Resources Found
        </h3>

        <p>
            Try another search or subject.
        </p>

    </div>


</main>


<footer>

    © 2026 Siinaaf School Hub • AS MODEL

</footer>


<script>


/* =========================================
   LIBRARY DATA
========================================= */

const defaultResources = [

    {
        title:
        "Grade 12 Biology",

        subject:
        "Biology",

        type:
        "PDF",

        description:
        "Biology study material for examination preparation.",

        url:
        "#"
    },

    {
        title:
        "Grade 12 Chemistry",

        subject:
        "Chemistry",

        type:
        "PDF",

        description:
        "Chemistry notes and revision resources.",

        url:
        "#"
    },

    {
        title:
        "Physics Revision",

        subject:
        "Physics",

        type:
        "PDF",

        description:
        "Physics revision materials for students.",

        url:
        "#"
    },

    {
        title:
        "Mathematics Resources",

        subject:
        "Mathematics",

        type:
        "Resource",

        description:
        "Mathematics learning and practice resources.",

        url:
        "#"
    }

];


/* =========================================
   LOAD LIBRARY
========================================= */

function getResources(){

    try{

        const saved =
            localStorage.getItem(
                "siinaafResources"
            );


        if(saved){

            return JSON.parse(saved);

        }


        localStorage.setItem(

            "siinaafResources",

            JSON.stringify(
                defaultResources
            )

        );


        return defaultResources;

    }catch(error){

        return defaultResources;

    }

}


/* =========================================
   RENDER
========================================= */

function renderLibrary(){

    const container =
        document.getElementById(
            "library"
        );

    const empty =
        document.getElementById(
            "empty"
        );


    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    const subject =
        document.getElementById(
            "subject"
        )
        .value;


    container.innerHTML = "";


    const resources =
        getResources();


    const filtered =
        resources.filter(
            item => {

                const text = (

                    item.title +
                    " " +
                    item.description +
                    " " +
                    item.subject

                ).toLowerCase();


                const searchMatch =
                    text.includes(search);


                const subjectMatch =
                    subject === "all" ||
                    item.subject === subject;


                return (
                    searchMatch &&
                    subjectMatch
                );

            }
        );


    if(
        filtered.length === 0
    ){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(
        item => {

            const card =
                document.createElement(
                    "article"
                );


            let icon = "📚";


            if(
                item.type === "PDF"
            ){

                icon = "📕";

            }

            else if(
                item.type === "Video"
            ){

                icon = "🎬";

            }

            else if(
                item.type === "Link"
            ){

                icon = "🔗";

            }


            card.className =
                "resource";


            card.innerHTML = `

                <div class="resourceIcon">
                    ${icon}
                </div>


                <div class="resourceMeta">

                    <span class="subject">
                        ${escapeHTML(
                            item.subject
                        )}
                    </span>

                    <span class="type">
                        ${escapeHTML(
                            item.type
                        )}
                    </span>

                </div>


                <h2>
                    ${escapeHTML(
                        item.title
                    )}
                </h2>


                <p>
                    ${escapeHTML(
                        item.description
                    )}
                </p>


                <a
                    class="openBtn"
                    href="${escapeAttribute(
                        item.url
                    )}"
                    target="_blank"
                    rel="noopener"
                >
                    OPEN RESOURCE →
                </a>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================
   HTML SAFETY
========================================= */

function escapeHTML(value){

    return String(value)

        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttribute(value){

    return String(value)

        .replaceAll("&","&amp;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");

}


/* =========================================
   START
========================================= */

renderLibrary();

</script>

</body>
</html>
